services:
  db:
    image: postgres:16-alpine
    container_name: gejian-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gejian}
      POSTGRES_USER: ${POSTGRES_USER:-gejian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gejian_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gejian} -d ${POSTGRES_DB:-gejian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: gejian-api
    container_name: gejian-api
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gejian:gejian_password@db:5432/gejian}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      INVITE_CODE: ${INVITE_CODE:-gejian-invite}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOADS_DIR: /app/uploads
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: gejian-web
    container_name: gejian-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
